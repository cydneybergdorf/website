<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fremandi: Text Adventure | Cydney Monroe</title><link rel="stylesheet" href="game.css"></head><body><main><div class="standalone"><a href="../index.html#school-projects">← Portfolio</a></div><h1>FREMANDI</h1><div id="transcript" role="log" aria-live="polite" aria-label="Game console" tabindex="0"></div><p class="hint">Enter 'h' for help.</p><form id="commandForm"><label for="command">&gt;</label><input id="command" aria-label="Command" maxlength="256" autocomplete="off" autocapitalize="none" spellcheck="false"></form></main><script src="adventure-data.js"></script><script src="adventure-engine.js"></script><script>
let game=new AdventureGame();const log=document.getElementById('transcript'),input=document.getElementById('command');function append(text,echo=false){const p=document.createElement('p');p.textContent=text;if(echo)p.className='command-echo';log.append(p);while(log.children.length>150)log.firstElementChild.remove();log.scrollTop=log.scrollHeight;}function command(text){if(!text.trim())return;append('> '+text,true);const cmd=text.trim().toLowerCase();if(cmd==='restart'){game=new AdventureGame();log.replaceChildren();append(game.look());}else if(cmd==='h'||cmd==='help'){append('look · go DIRECTION · get ITEM · inspect ITEM · check inventory · fix ship · quit · restart');}else append(game.command(text));input.value='';}document.getElementById('commandForm').onsubmit=e=>{e.preventDefault();command(input.value);input.focus({preventScroll:true});};append('A text adventure\n\nYour ship has crashed on planet Veor.\nYou need to recover the missing ship parts and repair your ship to escape.');append(game.look());
</script><script>if(new URLSearchParams(location.search).has('embed')){document.body.classList.add('embedded');const send=()=>parent.postMessage({type:'school-game-height',height:Math.ceil(document.querySelector('main').getBoundingClientRect().height)+2},'*');new ResizeObserver(send).observe(document.querySelector('main'));window.addEventListener('load',send);}</script></body></html>
